services:
  postgres:
    image: postgres:18-alpine
    container_name: indies-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: indies
      POSTGRES_PASSWORD: indies
      POSTGRES_DB: indies
    volumes:
      - indies-pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U indies -d indies"]
      interval: 5s
      retries: 10

volumes:
  indies-pg-data:
