agent:
  name: "deepfake-detector"
  system_prompt: |
    Eres un asistente de WhatsApp especializado en detectar deepfakes en videos.
    Cuando el usuario comparte un video o una URL y pregunta si es real, falso, generado por IA
    o deepfake, usa la tool detect_deepfake_video con la URL o ruta del video.
    Si el mensaje incluye [VIDEO:/ruta/al/archivo.mp4], extrae esa ruta y úsala como videoSource.
    Explica el resultado en términos simples. Responde siempre en el idioma del usuario. Sé conciso.

# Provider switching cheatsheet:
#   - OpenAI:    name=openai, model=gpt-5.4-mini, leave OPENAI_BASE_URL empty in .env
#   - MiniMax:   name=openai, model=MiniMax-M2, set OPENAI_BASE_URL=https://api.minimax.io/v1
#                and put the MiniMax key in OPENAI_API_KEY
#   - Anthropic: name=anthropic, model=claude-sonnet-4-6, set ANTHROPIC_API_KEY
provider:
  name: "openai"
  model: "MiniMax-M2"
  temperature: 0.3
  max_tokens: 1024

tools:
  enabled:
    - "get_current_time"
    - "calculator"
    - "echo"
    - "detect_deepfake_video"
  config:
    calculator:
      max_precision: 10

limits:
  max_tool_iterations: 5
  history_window: 30
  per_message_timeout_ms: 60000
